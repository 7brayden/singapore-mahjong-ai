[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-mahjong-ai"
version = "0.2.0"
description = "Singapore Mahjong game engine, AI agents, and discard advisor"
requires-python = ">=3.9"

[project.optional-dependencies]
plots = ["matplotlib", "numpy"]
dev = ["pytest"]

[project.scripts]
mahjong-advisor = "mahjong.advisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
