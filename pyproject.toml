[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-mahjong-ai"
version = "0.10.0"
description = "Singapore Mahjong game engine, AI agents, and discard advisor"
requires-python = ">=3.9"

[project.optional-dependencies]
plots = ["matplotlib", "numpy"]
server = ["fastapi", "uvicorn[standard]"]
dev = ["pytest", "httpx"]
ml = ["numpy", "scikit-learn"]  # training only — inference is pure Python

[project.scripts]
mahjong-advisor = "mahjong.advisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mahjong = ["ml/*.json"]  # trained model weights ship with the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
