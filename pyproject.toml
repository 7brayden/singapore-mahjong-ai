[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-mahjong-ai"
version = "0.10.0"
description = "Singapore Mahjong game engine, AI agents, and discard advisor"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.optional-dependencies]
plots = ["matplotlib", "numpy"]
server = ["fastapi", "uvicorn[standard]"]
# Coach LLM backends. Both optional and imported lazily — the coach
# falls back to its deterministic template when neither is installed.
coach = ["openai"]        # Azure OpenAI (the configured backend)
coach-anthropic = ["anthropic"]  # Anthropic Messages API
dev = ["pytest", "httpx"]
ml = ["numpy", "scikit-learn"]  # training only — inference is pure Python

[project.scripts]
mahjong-advisor = "mahjong.advisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mahjong = ["ml/*.json"]  # trained model weights ship with the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
