services:
  api:
    build: .
    container_name: mahjong-api
    ports:
      - "8000:8000"
    environment:
      # Coach LLM credentials. Set them in a local .env file next to
      # this compose file (gitignored). They stay server-side — the
      # browser never sees them. With none set, the coach falls back to
      # its deterministic template.
      #
      # Any OpenAI-compatible endpoint (OpenAI, Ollama, LM Studio, …).
      # From inside this container, a server on your Mac is reachable at
      # host.docker.internal, not localhost.
      - COACH_BASE_URL=${COACH_BASE_URL:-}
      - COACH_API_KEY=${COACH_API_KEY:-}
      # Azure OpenAI:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-}
      # Anthropic direct (alternative backend):
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COACH_MODEL=${COACH_MODEL:-}
      # Pin a backend explicitly: azure | anthropic | template
      - COACH_PROVIDER=${COACH_PROVIDER:-}

  web:
    build: ./frontend
    container_name: mahjong-web
    ports:
      - "5173:80"
    depends_on:
      - api
